:root{--bg:#f4f7ff;--g1:#ffd9a8aa;--g2:#bcd4ffaa;--fg:#0e1533;--card:#ffffffe0;--mut:#5b6590;--acc:#ff6a00;--acc2:#ffb300;--line:#1d3b8b1f;--sh:0 10px 30px #1d3b8b24;--inp:#f0f4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#070b1d;--g1:#ff6a0030;--g2:#2b5bff33;--fg:#eef1ff;--card:#111936d9;--mut:#8f9bd0;--acc:#ffb300;--acc2:#ff6a00;--line:#ffffff1a;--sh:0 10px 30px #0009;--inp:#0b1230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 0% -10%,var(--g1),transparent),radial-gradient(900px 500px at 100% 0,var(--g2),transparent),var(--bg);min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.logo{display:flex;gap:10px;align-items:center;font-size:26px}.logo b{display:block;font-size:18px;line-height:1;letter-spacing:.3px}.logo small{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800}
.tools{display:flex;gap:8px}.ic{width:42px;height:42px;padding:0;border-radius:50%;background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:var(--sh);font-size:18px}
.hero{padding:18px 4px 8px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:0 0 8px;font-weight:900}.hero em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:0;color:var(--mut);font-size:16px}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cols{display:grid;gap:0 16px}@media(min-width:900px){.cols{grid-template-columns:1.25fr 1fr;align-items:start}}
.lb{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--fg);outline:none}
input:focus,select:focus{border-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14px}.chk input{width:20px;height:20px;padding:0}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;color:var(--fg);background:var(--inp);transition:transform .08s}
button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
.pri{color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 8px 20px #ff6a004d}
[data-theme="dark"] .pri{color:#1a1200}
.alt{background:transparent;border:1px solid var(--line);color:var(--fg)}.sm{padding:8px 14px;font-size:13px}.wide{width:100%;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.mut{color:var(--mut);font-size:13px}.ctr{text-align:center;margin:8px 0}
.rw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mode{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;margin:6px 0;border-radius:14px;background:var(--inp);font-size:13px}.mode b{color:var(--acc)}
.chip{display:inline-block;padding:3px 10px;margin:2px 4px 2px 0;border-radius:99px;background:var(--inp);border:1px solid var(--line);font-size:12px;font-weight:700}
.chip.os{color:#2b8cff}.chip.in{color:#10a35a}.chip.rt{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0}
.code{font-size:38px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;color:#fff;padding:14px;border-radius:18px;background:linear-gradient(145deg,var(--tc),#000a);box-shadow:var(--sh);position:relative;overflow:hidden}
.tile b{font-size:24px;font-weight:900}.tile span{font-size:12px;opacity:.9}.tile em{font-style:normal;font-size:12px;background:#0004;border-radius:99px;padding:2px 8px;align-self:flex-start;margin-top:6px}
.tile.on{outline:3px solid var(--acc);outline-offset:2px}
.stage{border-top:4px solid var(--tc,var(--acc))}
.pl{display:flex;gap:16px;align-items:center;margin:8px 0}.pi{flex:1;min-width:0}.nm{font-size:clamp(22px,5vw,30px);font-weight:900;line-height:1.1;margin-bottom:4px}
.ph{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--line);background:var(--inp)}
.ph.xl{width:120px;height:120px;border:4px solid var(--tc,var(--acc));box-shadow:0 8px 24px #0003}.ph.sm{width:40px;height:40px}
.ph img,.ph svg.av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ph img{z-index:2}
.bidbox{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.amt{font-size:clamp(34px,9vw,52px);font-weight:900;line-height:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tmr span{font-size:26px;font-weight:900}
.bar{height:8px;border-radius:9px;background:var(--inp);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .25s linear}
.lead{margin:6px 0 10px}.bidbtn{width:100%;font-size:19px;padding:16px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tb{color:#fff;background:linear-gradient(145deg,var(--tc),#000a);padding:12px}
.soldbox{text-align:center}.stamp{display:inline-block;font-size:30px;font-weight:900;letter-spacing:3px;padding:4px 18px;border:4px solid;border-radius:10px;transform:rotate(-6deg);margin:10px 0;animation:pop .5s}
.stamp.s{color:#10b981}.stamp.u{color:#ef4444}
@keyframes pop{0%{transform:scale(2) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px}td,th{padding:9px 4px;border-bottom:1px solid var(--line)}tr.cl{cursor:pointer}tr.me td{font-weight:800}
.wrap{overflow-x:auto}
.sq{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.sq>div:nth-child(2){flex:1;min-width:0}.sq b{display:block;font-size:14px}.pr{font-weight:800;white-space:nowrap}

  document.querySelectorAll('.ph[data-pid="'+p.id+'"]').forEach(el=>{if(!el.querySelector('img')){const i=new Image();i.referrerPolicy='no-referrer';i.onload=()=>el.prepend(i);i.src=u}});
}
function loadPhotos(){const ids=new Set();document.querySelectorAll('.ph[data-pid]').forEach(e=>ids.add(+e.dataset.pid));[...ids].slice(0,40).forEach(id=>loadPhoto(PL[id]))}
const head=()=>`<div class="top"><div class="logo"><span>🏏</span><div><b>IPL Auction</b><small>ARENA</small></div></div><div class="tools">${S&&S.stage==='live'?`<button class="ic" onclick="mute=!mute;render()">${mute?'🔇':'🔊'}</button>`:''}<button class="ic" onclick="theme()">🌗</button></div></div>`;
function render(){
  const a=document.getElementById('app');
  a.innerHTML=head()+(!S?home():S.stage==='lobby'?lobby():S.stage==='live'?auction():result());
  loadPhotos();
}
const modeOpts=sel=>Object.keys(MODES).map(k=>`<option value="${k}" ${k==sel?'selected':''}>${MODES[k].n} · ${MODES[k].max} players · ₹${MODES[k].bud} Cr · ${MODES[k].os} overseas</option>`).join('');
function home(){
  let lr='';try{lr=localStorage.getItem('lr')||''}catch(e){}
  const pubs=pubList.length?pubList.map(r=>`<div class="rw"><div><b>${esc(r.code)}</b> <span class="chip">${MODES[r.mode].n}</span>${r.stage==='live'?'<span class="chip os">Live</span>':''}<div class="mut">Host: ${esc(r.hostName||'?')}</div></div><button class="pri sm" onclick="join('${esc(r.code)}')">Join</button></div>`).join(''):'<div class="mut">No public rooms open right now.</div>';
  const modes=Object.keys(MODES).map(k=>{const m=MODES[k];return`<div class="mode"><b>${m.n}</b><span>${m.max} players · ₹${m.bud} Cr · ${m.os} overseas</span></div>`}).join('');
  return`<div class="hero"><h1>Build your dream <em>IPL squad</em></h1><p>Live auctions with friends. Real players, real pressure.</p></div>
<div class="cols"><div>
<div class="card"><button class="alt sm" onclick="checkPhotos()">Find players without photos</button><div id="pc" class="mut" style="white-space:pre-wrap">${esc(PCT)}</div></div>
${lr?`<div class="card"><h2>Rejoin your room</h2><button class="pri wide" onclick="join('${esc(lr)}')">Rejoin ${esc(lr)}</button></div>`:''}
<div class="card"><label class="lb">Your name</label><input id="nm" maxlength="20" placeholder="Enter your name" value="${esc(NAME)}">
<label class="lb">Auction mode</label><select id="md">${modeOpts('mega')}</select>
<label class="chk"><input type="checkbox" id="pb"> Public room (shown in the list)</label>
<div class="row"><button class="pri" onclick="create()">Create online room</button><button class="alt" onclick="offline()">Play on one phone</button></div></div>
<div class="card"><h2>Join with a room code</h2><div class="row"><input id="jc" placeholder="e.g. R042-1234" autocapitalize="characters"><button class="pri" onclick="join()">Join</button></div></div></div>
<div><div class="card"><h2>Public rooms</h2>${pubs}</div><div class="card"><h2>Auction modes</h2>${modes}</div></div></div>
<div class="mut ctr">${db?'':'Online mode is not connected.'}</div>`;
}
function lobby(){
  const h=isHost(),m=MODES[S.mode];
  const tiles=Object.keys(TEAMS).map(t=>{const x=M[t],mine=x&&x.uid===uid,taken=x&&!mine&&!local;return`<button class="tile ${mine||(local&&x)?'on':''}" style="--tc:${TEAMS[t][1]}" ${taken?'disabled':''} onclick="claim('${t}')"><b>${t}</b><span>${TEAMS[t][0]}</span><em>${x?(local?'Playing':esc(x.name)+(mine?' (you)':'')):'Free'}</em></button>`}).join('');
  return`<div class="card"><div class="mut">${local?'One-phone auction':'Room code'}</div>${local?'':`<div class="code">${esc(S.code)}</div><button class="alt sm" onclick="copyCode()">Copy code</button>`}
<div class="mut" style="margin-top:6px">${m.n} · ${m.max} players · ₹${m.bud} Cr · ${m.os} overseas max${local?'':' · '+(S.pub?'Public':'Private')}</div>
${h?`<div class="row" style="margin-top:10px"><select onchange="setMode(this.value)">${modeOpts(S.mode)}</select><select onchange="setBt(this.value)">${btOpts()}</select>${local?'':`<button class="alt" onclick="setPub(${!S.pub})">Make ${S.pub?'private':'public'}</button>`}</div>`:''}</div>
<h2>${local?'Tap the teams that are playing':'Pick your team'}</h2><div class="tiles">${tiles}</div>
${h?`<button class="pri wide" style="margin-top:14px" onclick="start()">Start auction · ${Object.keys(M).length} teams</button><div class="mut ctr">Keep this screen open while the auction runs.</div>`:'<div class="mut ctr">Waiting for the host to start...</div>'}
<button class="alt wide" onclick="leave()">Leave room</button>`;
}
function squadCard(t){
  const T=S.teams[t],spent=T.sq.reduce((a,s)=>a+s.pr,0);
  return`<div class="card" style="border-top:4px solid ${TEAMS[t][1]}"><h2>${TEAMS[t][0]}</h2><div class="mut">Owner: ${esc(T.name)} · Spent ${cr(spent)} · ${T.sq.length} players</div>
${T.sq.slice().reverse().map(s=>{const p=PL[s.id];return`<div class="sq">${ph(p,'sm')}<div><b>${esc(p.n)}</b><span class="mut">${ROLE[p.r]}${p.o?' · overseas':''}</span></div><div style="text-align:right"><div class="pr">${cr(s.pr)}</div><span class="chip rt">★ ${p.q}</span></div></div>`}).join('')||'<div class="mut">No players yet.</div>'}</div>`;
}
function auction(){
  const c=S.cur,p=c&&PL[c.pid],mt=myTeam(),m=MODES[S.mode],L=S.last;
  const set=S.round==2?'Accelerated round':setName(S.i-1);
  let main='';
  if(c){
    const T=c.tm,col=T?TEAMS[T][1]:'var(--acc)',pct=Math.max(0,Math.min(100,rem(c)/TT()));
    let btn='';
    if(local)btn=`<div class="tgrid">${Object.keys(S.teams).map(t=>`<button class="tb" style="--tc:${TEAMS[t][1]}" ${S.teams[t].sq.length>=m.max||c.tm===t||!can(S.teams[t],p,need())?'disabled':''} onclick="bid('${t}')">${t} · ${cr(need())}</button>`).join('')}</div>`;
    else if(mt)btn=`<button class="pri bidbtn" ${c.tm===mt||!can(S.teams[mt],p,need())?'disabled':''} onclick="bid('${mt}')">${c.tm===mt?'You lead the bid':'BID '+cr(need())}</button>`;
    else btn='<div class="mut ctr">You are watching this auction.</div>';
    main=`<div class="card stage" style="--tc:${col}"><div class="mut">${set}</div>
<div class="pl">${ph(p,'xl')}<div class="pi"><div class="nm">${esc(p.n)}</div><div><span class="chip">${ROLE[p.r]}</span>${p.o?'<span class="chip os">✈ Overseas</span>':'<span class="chip in">🇮🇳 Indian</span>'}</div><div class="mut">Base price ${cr(base(p))}</div></div></div>
<div class="bidbox"><div><div class="mut">Current bid</div><div class="amt">${cr(c.bid)}</div></div><div class="tmr"><span id="tm">${Math.max(0,Math.ceil(rem(c)/1000))}s</span></div></div>
<div class="bar"><i id="bf" style="width:${pct}%"></i></div>
<div class="lead">${T?`Leading: <b style="color:${col}">${TEAMS[T][0]}</b>`:'No bids yet. Be the first!'}</div>${btn}</div>`;
  }else if(L){
    const q=PL[L.pid],sold=!!L.tm;
    main=`<div class="card stage soldbox" style="--tc:${sold?TEAMS[L.tm][1]:'#ef4444'}"><div class="pl" style="justify-content:center">${ph(q,'xl')}</div><div class="nm">${esc(q.n)}</div>
<div class="stamp ${sold?'s':'u'}">${sold?'SOLD':'UNSOLD'}</div>${sold?`<div><b style="color:${TEAMS[L.tm][1]}">${TEAMS[L.tm][0]}</b> · ${cr(L.pr)}</div><span class="chip rt">★ Rating ${q.q}</span>`:''}<div class="mut" style="margin-top:8px">Next player coming up...</div></div>`;
  }else main=`<div class="card stage"><div class="nm">🎙 ${esc(S.msg||'')}</div></div>`;
  const up=S.order.slice(S.i,S.i+15).map((id,k)=>{const q=PL[id];return`<div class="sq"><b style="width:22px">${k+1}</b>${ph(q,'sm')}<div><b>${esc(q.n)}</b><span class="mut">${ROLE[q.r]}${q.o?' · overseas':''} · ${S.round==2?'Accelerated':setName(S.i+k)}</span></div><div class="pr">${cr(base(q))}</div></div>`}).join('')||'<div class="mut">No more players in this round.</div>';
  const teams=Object.keys(S.teams).map(t=>{const x=S.teams[t];return`<tr class="cl ${t===mt?'me':''}" onclick="openT=openT==='${t}'?'':'${t}';render()"><td style="color:${TEAMS[t][1]}">${t} ▾<div class="mut">${esc(x.name)}</div></td><td>${cr(x.bud)}</td><td>${x.sq.length}/${m.max}</td><td>${x.os}/${m.os}</td></tr>`}).join('');
  if(S.paused)main=`<div class="card ctr"><b>⏸ Auction paused</b></div>`+main;
  const ctl=(isHost()?`<div class="card"><div class="row"><button class="${S.paused?'pri':'alt'}" onclick="${S.paused?'resume()':'pause()'}">${S.paused?'▶ Resume':'⏸ Pause'}</button><select onchange="setBt(this.value)">${btOpts()}</select>${local?'':`<button class="alt" onclick="setPub(${!S.pub})">${S.pub?'🌐 Public':'🔒 Private'}</button>`}</div><div class="mut">Host controls. Timer changes apply from the next bid.</div></div>`:`<div class="card mut">${S.pub?'🌐 Public room':'🔒 Private room'} · ${S.bt||10}s per bid</div>`)+`<button class="alt wide" onclick="leave()">Leave auction</button>`;
  return`<div class="cols"><div>${main}${ctl}
<div class="card feed"><div class="mut">Live feed</div>${(S.log||[]).map(x=>`<div>${esc(x)}</div>`).join('')||'<div class="mut">-</div>'}</div>
<button class="alt wide" onclick="showUp=!showUp;render()">${showUp?'Hide':'Show'} upcoming players</button>${showUp?`<div class="card"><h2>Coming up next</h2>${up}</div>`:''}</div>
<div><div class="card wrap"><h2>Teams</h2><table><tr><th>Team</th><th>Purse</th><th>Squad</th><th>OS</th></tr>${teams}</table><div class="mut" style="margin-top:6px">Tap a team to see its squad, prices and ratings.</div></div>
${openT&&S.teams[openT]?squadCard(openT):(mt?squadCard(mt):'')}</div></div>`;
}
function result(){
  const ids=Object.keys(S.teams).map(t=>({t,r:rate(S.teams[t])})).sort((a,b)=>b.r.score-a.r.score);
  return`<div class="hero"><h1>Auction <em>complete</em></h1><p>Teams ranked by squad balance and player quality.</p></div>
${ids.map((x,i)=>{const T=S.teams[x.t];return`<div class="card" style="border-top:4px solid ${TEAMS[x.t][1]}"><div class="rank"><div class="rk">#${i+1}</div><div><h2 style="margin:0;color:${TEAMS[x.t][1]}">${TEAMS[x.t][0]}</h2><div class="mut">${esc(T.name)} · Purse left ${cr(T.bud)}</div></div><div style="margin-left:auto;font-size:26px;font-weight:900">${x.r.score}</div></div>
<div class="meter"><i style="width:${x.r.score}%"></i></div><div><b>${x.r.grade}</b> · Star: ${esc(x.r.best)}</div>
${x.r.gaps.length?`<div class="mut">Needs: ${x.r.gaps.join(', ')}</div>`:'<div class="mut">Balanced: openers, middle order, finishers, pace and spin covered</div>'}
<div style="margin-top:8px">${T.sq.map(s=>{const p=PL[s.id];return`<div class="sq">${ph(p,'sm')}<div><b>${esc(p.n)}</b><span class="mut">${ROLE[p.r]}${p.o?' · overseas':''}</span></div><div style="text-align:right"><div class="pr">${cr(s.pr)}</div><span class="chip rt">★ ${p.q}</span></div></div>`}).join('')}</div></div>`}).join('')}
<button class="pri wide" onclick="analyst()">Ask the analyst</button><div class="card" id="ai" style="white-space:pre-wrap">Tap the button for expert commentary.</div><button class="alt wide" onclick="leave()">Back to home</button>`;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('ipl-sw-v2.js').catch(()=>{});
init();
</script></body></html>
