  const big=sq.length>=11,nd=big?{O:2,M:2,F:1,P:3,S:1,A:1}:{O:1,M:1,F:1,P:1,S:1,A:1};
  const grp=p=>p.r==='W'?'M':p.r,gaps=[];let cov=0;
  for(const g in nd){const c=sq.filter(p=>grp(p)===g).length;cov+=Math.min(c,nd[g])/nd[g];if(c<nd[g])gaps.push(({O:'opener',M:'middle order',F:'finisher',P:'pace bowling',S:'spin',A:'all-rounder'})[g])}
  cov=Math.min(1,cov/6/Math.min(1,sq.length/6));
  const q=sq.reduce((a,p)=>a+p.q,0)/sq.length,score=Math.round(q*.6+cov*40),best=sq.slice().sort((a,b)=>b.q-a.q)[0].n;
  return{score,gaps,best,q:Math.round(q),grade:score>=88?'A+ Champions material':score>=80?'A Title contenders':score>=72?'B Playoff team':score>=64?'C Mid-table':'D Rebuild needed'};
}
async function analyst(){
  const el=document.getElementById('ai');if(!sampleFn){el.textContent='AI analyst is not available here.';return}
  el.textContent='Analyst is thinking...';
  const d=Object.keys(S.teams).map(t=>`${TEAMS[t][0]} (${S.teams[t].name}): `+S.teams[t].sq.map(s=>`${PL[s.id].n} [${ROLE[PL[s.id].r]}] ${cr(s.pr)}`).join(', ')).join('\n');
  try{const r=await sampleFn('You are an IPL cricket analyst. Based on each squad below, using your knowledge of the players’ career records and recent form, write 2 punchy sentences per team about strengths and weaknesses (openers, middle order, finishers, pace, spin), then name the best team overall. Squads:\n'+d,{cache:false});el.textContent=r.text}catch(e){el.textContent='Analyst unavailable right now.'}
}
/* ---------- UI ---------- */
function render(){
  const a=document.getElementById('app');
  if(!S)return a.innerHTML=home();
  a.innerHTML=S.stage==='lobby'?lobby():S.stage==='live'?auction():result();
}
function home(){
  return`<h1>🏏 IPL Auction Arena</h1><div class="mut">Bid with friends: 100 rooms, up to 10 teams per room.</div>
<div class="card"><input id="nm" placeholder="Your name" value="${esc(NAME)}" style="width:100%">
<div class="row"><select id="md">${Object.keys(MODES).map(k=>`<option value="${k}">${MODES[k].n} · ${MODES[k].max} players · ₹${MODES[k].bud} Cr · ${MODES[k].os} overseas</option>`).join('')}</select></div>
<label><input type="checkbox" id="pb" style="margin-right:6px">Public room (shown in the list)</label>
<div class="row"><button onclick="create()">Create online room</button><button class="alt" onclick="offline()">Play offline (one phone)</button></div></div>
<div class="card"><h2>Join with a room code</h2><div class="row"><input id="jc" placeholder="e.g. R042-1234"><button onclick="join()">Join</button></div></div>
<div class="card"><h2>Public rooms</h2>${pubList.length?pubList.map(r=>`<div class="row"><div>${esc(r.code)} · ${MODES[r.mode].n}<div class="mut">Host: ${esc(r.hostName||'?')}</div></div><button onclick="join('${r.code}')">Join</button></div>`).join(''):'<div class="mut">No public rooms open right now.</div>'}</div>
${db?'<div class="mut">Online play is ON.</div>':'<div class="card"><b>Connect online play</b><div class="mut">Paste your Firebase config here once, then tap Save.</div><textarea id="fb" rows="6" style="width:100%" placeholder="const firebaseConfig = {...}"></textarea><button onclick="saveCfg()">Save</button></div>'}`;
}
function lobby(){
  const h=isHost(),m=MODES[S.mode];
  return`<h1>Room ${esc(S.code)}</h1>
<div class="card"><b>${m.n} mode</b><div class="mut">${m.max} players max · ₹${m.bud} Cr · ${m.os} overseas max · ${S.pub?'Public':'Private'} room</div>
${S.code!=='LOCAL'?'<div class="mut">Share the code above with friends so they can join.</div>':''}
${h?`<div class="row"><select onchange="setMode(this.value)">${Object.keys(MODES).map(k=>`<option value="${k}" ${k==S.mode?'selected':''}>${MODES[k].n}</option>`).join('')}</select>${local?'':`<button class="alt" onclick="setPub(${!S.pub})">Make ${S.pub?'private':'public'}</button>`}</div>`:''}</div>
<h2>${local?'Tap teams that are playing':'Pick your team'}</h2><div class="grid">${Object.keys(TEAMS).map(t=>{const x=M[t];return`<button class="tm" style="background:${TEAMS[t][1]};opacity:${x&&x.uid!==uid&&!local?.45:1}" onclick="claim('${t}')">${t}<small>${TEAMS[t][0]}</small><small>${x?(local?'✔ playing':esc(x.name)+(x.uid===uid?' (you)':'')):'free'}</small></button>`}).join('')}</div>
${h?`<button style="width:100%;margin-top:12px" onclick="start()">Start auction (${Object.keys(M).length} teams)</button><div class="mut">Host keeps this page open during the auction.</div>`:'<div class="mut">Waiting for the host to start...</div>'}
<button class="alt" onclick="leave()">Leave room</button>`;
}
function auction(){
  const c=S.cur,p=c&&PL[c.pid],mt=myTeam(),m=MODES[S.mode];
  const set=S.round==2?'Accelerated round':setName(S.i-1);
  let h=`<div class="row"><div><b>${esc(S.code)}</b> · ${m.n}</div><div style="text-align:right"><button class="alt" onclick="mute=!mute;render()">${mute?'🔇':'🔊'}</button></div></div>`;
  h+=`<div class="card">`;
  if(c){const T=c.tm;h+=`<div class="mut">${set} · ${S.i}/${S.order.length}</div><div class="row" style="flex-wrap:nowrap">${av(p)}<div style="flex:1"><div class="big">${esc(p.n)}</div><span class="chip">${ROLE[p.r]}</span>${p.o?'<span class="chip">✈ Overseas</span>':'<span class="chip">🇮🇳 Indian</span>'}<span class="chip">Rating ${p.q}</span><div class="mut">Base ${cr(base(p))}</div></div></div>
<div class="big" style="margin-top:8px">${cr(c.bid)} <span id="tm" class="mut">${Math.max(0,Math.ceil((c.end-Date.now())/1000))}s</span></div>
<div>${T?`Highest bid: <b style="color:${TEAMS[T][1]}">${TEAMS[T][0]}</b>`:'No bids yet'}</div>`;
    if(local)h+=`<div class="grid">${Object.keys(S.teams).map(t=>`<button class="tm" style="background:${TEAMS[t][1]}" ${S.teams[t].sq.length>=m.max||c.tm===t||!can(S.teams[t],p,need())?'disabled':''} onclick="bid('${t}')">${t} · ${cr(need())}</button>`).join('')}</div>`;
    else if(mt)h+=`<button style="width:100%;margin-top:8px;background:${TEAMS[mt][1]}" ${c.tm===mt||!can(S.teams[mt],p,need())?'disabled':''} onclick="bid('${mt}')">${c.tm===mt?'You lead the bid':'BID '+cr(need())}</button>`;
    else h+='<div class="mut">You are watching.</div>';
  }else h+=`<div class="big">🎙 ${esc(S.msg||'')}</div>`;
  h+=`</div><div class="card"><div class="mut">Live feed</div>${(S.log||[]).map(x=>`<div>${esc(x)}</div>`).join('')||'<div class="mut">-</div>'}</div>`;
  h+=`<button class="alt" style="width:100%" onclick="showUp=!showUp;render()">${showUp?'Hide':'Show'} upcoming players</button>`;
  if(showUp){const up=S.order.slice(S.i,S.i+15);h+=`<div class="card"><div class="mut">Coming up next</div>${up.map((id,k)=>{const q=PL[id];return`<div>${k+1}. <b>${esc(q.n)}</b> <span class="mut">${ROLE[q.r]}${q.o?' · overseas':''} · base ${cr(base(q))} · ${S.round==2?'Accelerated':setName(S.i+k)}</span></div>`}).join('')||'<div class="mut">No more players.</div>'}</div>`}
  h+=`<div class="card wrap"><table><tr><th>Team</th><th>Purse</th><th>Squad</th><th>OS</th></tr>${Object.keys(S.teams).map(t=>{const x=S.teams[t];return`<tr${t===mt?' style="font-weight:700"':''}><td style="color:${TEAMS[t][1]}">${t}<div class="mut">${esc(x.name)}</div></td><td>${cr(x.bud)}</td><td>${x.sq.length}/${m.max}</td><td>${x.os}/${m.os}</td></tr>`}).join('')}</table></div>`;
  if(mt)h+=`<div class="card"><div class="mut">Your squad</div>${S.teams[mt].sq.map(s=>`<div>${esc(PL[s.id].n)} <span class="mut">${cr(s.pr)}</span></div>`).join('')||'-'}</div>`;
  return h;
}
function result(){
  const ids=Object.keys(S.teams).map(t=>({t,r:rate(S.teams[t])})).sort((a,b)=>b.r.score-a.r.score);
  return`<h1>🏆 Auction over</h1>${ids.map((x,i)=>{const T=S.teams[x.t];return`<div class="card"><div class="big" style="color:${TEAMS[x.t][1]}">#${i+1} ${TEAMS[x.t][0]}</div><div>${esc(T.name)} · Score <b>${x.r.score}/100</b> · ${x.r.grade}</div><div class="mut">Squad quality ${x.r.q||0} · Star: ${esc(x.r.best)} · Purse left ${cr(T.bud)}</div>${x.r.gaps.length?`<div>⚠ Needs: ${x.r.gaps.join(', ')}</div>`:'<div>✅ Balanced: openers, middle order, finishers, pace and spin covered</div>'}<div class="mut">${T.sq.map(s=>esc(PL[s.id].n)+' ('+PL[s.id].r+', '+cr(s.pr)+')').join(' · ')}</div></div>`}).join('')}
<button style="width:100%" onclick="analyst()">Ask the AI analyst</button><div class="card" id="ai" style="white-space:pre-wrap">Tap the button for expert commentary.</div><button class="alt" onclick="leave()">Back to home</button>`;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('ipl-sw.js').catch(()=>{});
init();
